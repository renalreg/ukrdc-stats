[tox]
isolated_build = true
envlist = pytest, ruff_format, ruff_lint, bandit, pre_commit_checks


[testenv]
allowlist_externals = poetry
commands =
    poetry install -v


[testenv:ruff_lint]
description = 'linting with ruff'
#commands = poetry run black --check ukrdc_stats/
commands = poetry run ruff check ukrdc_stats/ 

[testenv:pytest]
description = 'Run Python tests with pytest test runner.'
commands = poetry run pytest --cov=ukrdc_stats --cov-report term-missing --cov-report xml tests/

[testenv:mypy]
description = 'Execute static analysis with mypy (type annotations).'
plugins = sqlalchemy.ext.mypy.plugin
commands = poetry run mypy ukrdc_stats/

[testenv:pylint]
description = 'Execute static analysis with pylint.'
commands = poetry run ruff check ukrdc_stats/

[testenv:bandit]
description = 'Execute static analysis with bandit.'
commands = poetry run bandit -r ukrdc_stats/ 


[testenv:pre_commit_checks]

description = 'run some automated housekeeping'
commands =
    poetry run sh -c "nbstripout --strip --keep-count --force $(ls demo/*.ipynb)"
    poetry run ruff check ukrdc_stats/ --fix

[testenv:ruff_format]
description = 'Check code style with ruff'
commands = poetry run ruff format ukrdc_stats/