[tox]
isolated_build = true
envlist = pytest, ruff_format, ruff_lint, ruff_light, sqlfluff


[testenv]
allowlist_externals = poetry
commands =
    poetry install -v


[testenv:ruff_lint]
description = 'linting with ruff'
#commands = poetry run black --check ukrdc_stats/
commands = poetry run ruff check ukrdc_stats/ tests/

[testenv:ruff_light]
description = 'Minimal lint for extraction scripts.'
commands = poetry run ruff check scripts/ demo/ --select F,S

[testenv:pytest]
description = 'Run Python tests with pytest test runner.'
commands = poetry run pytest --cov=ukrdc_stats --cov-report term-missing --cov-report xml tests/

#[testenv:pyright]
#description = 'Static type checking with pyright (pragmatic strict).'
#commands = poetry run pyright

#[testenv:import_linter]
#description = 'Architecture boundary checks with import-linter.'
#commands = poetry run lint-imports

[testenv:sqlfluff]
description = 'Lint SQL scripts with sqlfluff.'
commands = poetry run sqlfluff lint scripts/


[testenv:ruff_format]
description = 'Check code style with ruff'
commands = poetry run ruff format --check ukrdc_stats/ tests/ scripts/