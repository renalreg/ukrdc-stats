[tox]
isolated_build = true
envlist = pytest, ruff_format, ruff_lint, pyright, vulture, import_linter, sqlfluff, darglint, interrogate, pre_commit


[testenv]
allowlist_externals = poetry
commands =
    poetry install -v


[testenv:ruff_lint]
description = 'linting with ruff'
#commands = poetry run black --check ukrdc_stats/
commands = poetry run ruff check ukrdc_stats/ tests/ scripts/

[testenv:pytest]
description = 'Run Python tests with pytest test runner.'
commands = poetry run pytest --cov=ukrdc_stats --cov-report term-missing --cov-report xml tests/

[testenv:pyright]
description = 'Static type checking with pyright (pragmatic strict).'
commands = poetry run pyright

[testenv:vulture]
description = 'Dead code detection with vulture.'
commands = poetry run vulture

[testenv:import_linter]
description = 'Architecture boundary checks with import-linter.'
commands = poetry run lint-imports

[testenv:sqlfluff]
description = 'Lint SQL scripts with sqlfluff.'
commands = poetry run sqlfluff lint scripts/

[testenv:darglint]
description = 'Check docstrings match signatures with darglint.'
commands = poetry run darglint ukrdc_stats

[testenv:interrogate]
description = 'Docstring coverage floor with interrogate.'
commands = poetry run interrogate --fail-under 80 ukrdc_stats

[testenv:pre_commit]
description = 'Run pre-commit hooks over all files.'
commands = poetry run pre-commit run --all-files

[testenv:ruff_format]
description = 'Check code style with ruff'
commands = poetry run ruff format --check ukrdc_stats/ tests/ scripts/